<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hope Starts Small — Chapter 1: Seeds</title>
<!-- Asset stamps (?v=YYYYMMDD-N): bump N on EVERY shipped change to
     game.js / style.css. A day of rapid builds left players on stale
     cached copies (Daniel's phone, Nov 26, 2026); the stamp makes each
     build a fresh URL. Scheme recorded in the goal's build log. -->
<link rel="stylesheet" href="style.css?v=20261127-4">
</head>
<body>
  <div id="console">
    <div id="screen">
      <canvas id="game" width="320" height="288"></canvas>
      <div id="titleLinks">
        <a id="audibleBtn" href="https://www.audible.com/pd/Hope-Starts-Small-Audiobook/B0DZPCHT4M" target="_blank" rel="noopener" hidden>&#9834; LISTEN ON AUDIBLE</a>
        <a id="bookBtn" href="https://www.amazon.com/dp/B0DXVKQHZ2" target="_blank" rel="noopener" hidden>BUY THE BOOK</a>
      </div>
    </div>
    <div id="deck" hidden>
      <div id="stick">
        <div id="stickBase" role="application" aria-label="Analog stick">
          <span class="tick up"></span><span class="tick right"></span><span class="tick down"></span><span class="tick left"></span>
          <div id="stickKnob"></div>
        </div>
      </div>
      <button id="btnMenu" type="button" aria-label="Menu">MENU</button>
      <div id="touchBtns">
        <button id="btnB" type="button" aria-label="B button">B</button>
        <button id="btnA" type="button" aria-label="A button">A</button>
      </div>
    </div>
  </div>
  <!-- text.js is the game's writing (all dialogue & commentary) in one
       reviewable file. It is deliberately NOT stamped: Daniel edits it,
       pushes, and a normal refresh speaks his words once Pages' ordinary
       cache expires. -->
  <script src="text.js"></script>
  <script src="game.js?v=20261128-2"></script>
  <script data-goatcounter="https://hopestartssmall.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
